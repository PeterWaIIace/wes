<a class="tt-tile" id="tile" href="#">
    <span class="dot" id="dot"></span>
    <div class="tt-main">
        <div class="tt-title">
            <span class="tt-name" id="name"></span>
            <span class="tt-badge" id="state-badge"></span>
        </div>
        <div class="tt-sub">
            <span class="tt-repo" id="repo"></span>
            <span class="tt-branch" id="branch"></span>
            <span class="tt-runs" id="runs"></span>
        </div>
    </div>
    <div class="tt-job">
        <span class="tt-job-label">latest job</span>
        <span class="tt-job-id" id="job-id"></span>
    </div>
    <div class="tt-resources" id="resources"></div>
    <span class="tt-actions">
        <button class="btn-ghost tt-launch" id="launch-btn" title="Launch"><i data-lucide="play"></i></button>
        <button class="btn-ghost tt-edit" id="edit-btn" title="Configure"><i data-lucide="settings"></i></button>
        <button class="btn-ghost tt-edit tt-delete" id="delete-btn" title="Remove"><i data-lucide="trash-2"></i></button>
    </span>
</a>
