<div class="sd-layout">
    <div class="sd-config">
        <div class="sd-section">
            <div class="sd-section-header">
                <h2>Cluster</h2>
                <div class="sd-cluster-bar">
                    <input type="text" id="ssh-input" placeholder="SSH host" class="sd-ssh-input">
                    <button class="sd-btn" id="query-btn">Query</button>
                </div>
            </div>
            <chip-select id="partition-chips" class="sd-hidden"></chip-select>
            <div id="node-grid" class="sd-node-grid"></div>
            <div id="node-none" class="sd-empty">Enter an SSH host and click Query to load nodes</div>
        </div>

        <div class="sd-section">
            <h2>Resources</h2>
            <div class="sd-sliders">
                <div class="sd-resource-row">
                    <div class="sd-resource-label"><span class="sd-resource-icon">CPU</span></div>
                    <resource-slider id="cpu-slider" min="1" max="64" value="1" suffix="" color="cpu"></resource-slider>
                </div>
                <div class="sd-resource-row">
                    <div class="sd-resource-label"><span class="sd-resource-icon">GPU</span></div>
                    <resource-slider id="gpu-slider" min="0" max="8" value="0" suffix="" color="gpu"></resource-slider>
                </div>
                <div class="sd-resource-row">
                    <div class="sd-resource-label"><span class="sd-resource-icon">MEM</span></div>
                    <resource-slider id="mem-slider" min="1" max="128" value="4" suffix="G" color="mem"></resource-slider>
                </div>
            </div>
        </div>

        <div class="sd-section">
            <h2>Time Limit</h2>
            <div class="sd-time-control">
                <time-chips id="time-chips"></time-chips>
                <div class="sd-time-slider-row">
                    <input type="range" id="time-slider" min="0.5" max="168" step="0.5" value="4" class="sd-slider sd-slider-time">
                    <span id="time-display" class="sd-time-display">04:00:00</span>
                </div>
            </div>
        </div>

        <div class="sd-section">
            <h2>Job</h2>
            <div class="sd-grid-2">
                <div class="sd-field"><label>Name</label><input type="text" id="job-name" value="wes_job"></div>
                <div class="sd-field"><label>Tasks</label><input type="number" id="ntasks" value="1" min="1" max="64"></div>
                <div class="sd-field"><label>Output</label><input type="text" id="output" placeholder="job_output.txt"></div>
                <div class="sd-field"><label>Error</label><input type="text" id="error" placeholder="job_error.txt"></div>
                <div class="sd-field"><label>Account</label><input type="text" id="account"></div>
                <div class="sd-field"><label>QOS</label><input type="text" id="qos"></div>
            </div>
        </div>

        <div class="sd-section">
            <h2>Environment</h2>
            <div id="env-vars-list"></div>
            <button type="button" class="sd-btn" id="add-env-btn">+ Add Variable</button>
        </div>

        <div class="sd-section">
            <h2>Script</h2>
            <div class="sd-field">
                <label>Pre-run Script (sourced before command)</label>
                <input type="text" id="script-path" placeholder="path/to/setup.sh">
            </div>
            <div class="sd-field">
                <label>Command to Run</label>
                <textarea id="command" rows="3" placeholder="uv run train.py --lr 0.01"></textarea>
            </div>
        </div>
    </div>

    <div class="sd-preview">
        <div class="sd-preview-sticky">
            <div class="sd-preview-header">
                <h2>Generated Script</h2>
                <button class="sd-btn" id="copy-script-btn">Copy</button>
            </div>
            <pre class="sd-code-block" id="script-output"></pre>

            <div class="sd-preview-header" style="margin-top:1rem">
                <h2>sbatch Command</h2>
                <button class="sd-btn" id="copy-args-btn">Copy</button>
            </div>
            <pre class="sd-code-block sd-code-cmd" id="args-output"></pre>
        </div>
    </div>
</div>
