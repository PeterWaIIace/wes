{% extends "base.html" %}
{% block title %}wes - Submit{% endblock %}

{% block content %}
<h1>Submit</h1>

<div class="panel">
    <div class="panel-header">
        <h2>Tasks</h2>
        <div style="display:flex;gap:0.5rem;align-items:center">
            <span id="config-status" class="cluster-status-text"></span>
            <button class="btn btn-sm" id="reload-btn">Reload</button>
            <button class="btn btn-sm btn-primary" id="run-all-btn">Run All</button>
        </div>
    </div>
    <div id="config-error"></div>
    <div id="task-tiles" class="task-tiles"></div>
    <div id="task-empty" class="empty-state" style="display:none">
        No .wes config files found in project root
    </div>
</div>

<div id="result" class="hidden"></div>
{% endblock %}

{% block scripts %}
<script type="module">
let taskConfigs = [];

const TIME_PRESETS = [
    {label: '30m', hours: 0.5},
    {label: '1h', hours: 1},
    {label: '2h', hours: 2},
    {label: '4h', hours: 4},
    {label: '8h', hours: 8},
    {label: '24h', hours: 24},
    {label: '2d', hours: 48},
    {label: '7d', hours: 168},
];

function parseMemGB(s) {
    if (!s) return 0;
    s = s.trim().toUpperCase();
    if (s.endsWith('G')) return parseFloat(s);
    if (s.endsWith('M')) return Math.round(parseInt(s) / 1024) || 1;
    return parseInt(s) || 0;
}

function parseTimeHours(s) {
    if (!s) return 0;
    const parts = s.trim().split(':');
    if (parts.length === 3) return parseInt(parts[0]) + parseInt(parts[1]) / 60;
    return parseFloat(s) || 0;
}

function formatTime(hours) {
    const h = Math.floor(hours);
    const m = Math.round((hours - h) * 60);
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':00';
}

async function loadConfig() {
    const status = document.getElementById('config-status');
    const error = document.getElementById('config-error');
    const tiles = document.getElementById('task-tiles');
    const empty = document.getElementById('task-empty');
    status.textContent = 'Loading...';
    error.innerHTML = '';

    try {
        const resp = await fetch('/api/config');
        const data = await resp.json();
        taskConfigs = data;
        if (!data.length) {
            tiles.innerHTML = '';
            empty.style.display = '';
            status.textContent = '';
            return;
        }
        empty.style.display = 'none';
        renderTiles();
        status.textContent = data.length + ' task' + (data.length > 1 ? 's' : '');
    } catch (err) {
        error.innerHTML = '<div class="error">' + err.message + '</div>';
        status.textContent = '';
    }
}

function renderTiles() {
    const tiles = document.getElementById('task-tiles');
    tiles.innerHTML = '';
    taskConfigs.forEach((t, i) => {
        const repo = t.git_url.split('/').pop().replace('.git', '');
        const memGB = parseMemGB(t.memory) || 4;
        const timeH = parseTimeHours(t.time) || 4;
        const cpus = parseInt(t.cpus) || 1;
        const gpus = parseInt(t.gpus) || 0;

        const tile = document.createElement('div');
        tile.className = 'st-tile';
        tile.id = 'tile-' + i;
        tile.innerHTML = `
            <div class="st-header">
                <div class="st-title">${t.name}</div>
                <button class="btn btn-sm btn-primary" data-action="run" data-index="${i}">Run</button>
            </div>
            <div class="st-info">
                <span class="st-info-item mono">${repo}</span>
                ${t.branch ? '<span class="st-info-item">' + t.branch + '</span>' : ''}
                <span class="st-info-item mono">${t.ssh || ''}</span>
            </div>
            <div class="st-controls">
                <div class="st-row">
                    <div class="st-field">
                        <label>Node</label>
                        <input type="text" class="st-input" data-i="${i}" data-key="nodelist" value="${t.nodelist || ''}" placeholder="any">
                    </div>
                    <resource-slider label="Memory" min="1" max="128" value="${memGB}" suffix="G" color="mem" data-i="${i}" data-key="memory"></resource-slider>
                </div>
                <div class="st-row">
                    <resource-slider label="CPUs" min="1" max="64" value="${cpus}" suffix="" color="cpu" data-i="${i}" data-key="cpus"></resource-slider>
                    <resource-slider label="GPUs" min="0" max="8" value="${gpus}" suffix="" color="gpu" data-i="${i}" data-key="gpus"></resource-slider>
                    <div class="st-field st-field-time">
                        <label>Time</label>
                        <time-chips data-i="${i}" data-hours="${timeH}"></time-chips>
                    </div>
                </div>
            </div>
        `;
        tiles.appendChild(tile);

        tile.querySelector('[data-action="run"]').addEventListener('click', () => submitTask(i));
    });

    tiles.querySelectorAll('.st-input').forEach(el => {
        el.addEventListener('input', e => {
            const i = parseInt(e.target.dataset.i);
            const key = e.target.dataset.key;
            taskConfigs[i][key] = e.target.value;
        });
    });

    tiles.querySelectorAll('resource-slider').forEach(slider => {
        slider.addEventListener('slider-change', e => {
            const i = parseInt(slider.dataset.i);
            const key = slider.dataset.key;
            const suffix = slider.getAttribute('suffix') || '';
            if (key === 'memory') taskConfigs[i].memory = e.detail.value + 'G';
            else taskConfigs[i][key] = String(e.detail.value);
        });
    });

    tiles.querySelectorAll('time-chips').forEach(tc => {
        tc.value = parseFloat(tc.dataset.hours);
        tc.addEventListener('time-change', e => {
            const i = parseInt(tc.dataset.i);
            taskConfigs[i].time = e.detail.time;
        });
    });
}

function collectOverrides(i) {
    const t = taskConfigs[i];
    const overrides = {};
    if (t.nodelist) overrides.nodelist = t.nodelist;
    if (t.memory) overrides.memory = t.memory;
    if (t.time) overrides.time = t.time;
    if (t.cpus) overrides.cpus = String(t.cpus);
    if (t.gpus) overrides.gpus = String(t.gpus);
    if (t.partition) overrides.partition = t.partition;
    return overrides;
}

async function submitTask(i) {
    const btn = document.querySelector(`#tile-${i} [data-action="run"]`);
    btn.disabled = true;
    btn.textContent = '...';
    const result = document.getElementById('result');
    result.className = '';
    result.textContent = 'Submitting ' + taskConfigs[i].name + '...';

    try {
        const resp = await fetch('/api/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: taskConfigs[i].name,
                overrides: collectOverrides(i),
            }),
        });
        const data = await resp.json();
        if (resp.ok) {
            result.textContent = data.message || (data.task + ': ' + data.state);
        } else {
            result.textContent = 'Error: ' + (data.detail || 'Unknown error');
        }
    } catch (err) {
        result.textContent = 'Error: ' + err.message;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Run';
    }
}

async function submitAll() {
    const result = document.getElementById('result');
    result.className = '';
    const lines = ['Submitting all tasks...'];
    result.textContent = lines.join('\n');

    for (let i = 0; i < taskConfigs.length; i++) {
        const btn = document.querySelector(`#tile-${i} [data-action="run"]`);
        btn.disabled = true;
        btn.textContent = '...';
        try {
            const resp = await fetch('/api/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: taskConfigs[i].name,
                    overrides: collectOverrides(i),
                }),
            });
            const data = await resp.json();
            if (resp.ok) {
                lines.push(taskConfigs[i].name + ': ' + (data.message || data.state));
            } else {
                lines.push(taskConfigs[i].name + ': ERROR - ' + (data.detail || 'Unknown'));
            }
        } catch (err) {
            lines.push(taskConfigs[i].name + ': ERROR - ' + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Run';
        }
        result.textContent = lines.join('\n');
    }
}

document.getElementById('reload-btn').addEventListener('click', loadConfig);
document.getElementById('run-all-btn').addEventListener('click', submitAll);

loadConfig();
</script>
{% endblock %}
