{% extends "base.html" %}
{% block title %}wes - Submit{% endblock %}

{% block content %}
<h1>Submit Task</h1>

<div class="panel">
    <div class="panel-header">
        <h2>.wes Configuration</h2>
    </div>
    <div class="panel-body">
        <form id="submit-form" onsubmit="submitConfig(event)">
            <textarea id="config" name="config" rows="18" spellcheck="false">sequence:
    my-task:
        git_url: ssh://git@your-repo.git
        branch: main
        ssh: your-ssh-host
        run:
            - path/to/run.sh
        job:
            path/to/job.sh
        artifacts:
            - results/folder
        post:
            path/to/post.sh
        cleanup: True</textarea>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Run</button>
            </div>
        </form>
        <div id="result" class="hidden"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function submitConfig(e) {
    e.preventDefault();
    const config = document.getElementById('config').value;
    const result = document.getElementById('result');
    result.className = '';
    result.textContent = 'Submitting...';
    try {
        const resp = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config: config })
        });
        const data = await resp.json();
        if (resp.ok) {
            let lines = [];
            if (data.tasks && data.tasks.length) lines.push('Started: ' + data.tasks.join(', '));
            if (data.errors && data.errors.length) { lines.push('Errors:'); data.errors.forEach(err => lines.push('  ' + err)); }
            if (!lines.length) lines.push('No tasks started');
            result.textContent = lines.join('\n');
        } else {
            result.textContent = 'Error: ' + (data.detail || 'Unknown error');
        }
    } catch (err) {
        result.textContent = 'Error: ' + err.message;
    }
}
</script>
{% endblock %}
