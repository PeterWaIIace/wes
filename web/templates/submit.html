{% extends "base.html" %}
{% block title %}wes - Submit{% endblock %}

{% block content %}
<h1>Submit</h1>

<div class="panel">
    <div class="panel-header">
        <h2>Tasks</h2>
        <div style="display:flex;gap:0.5rem;align-items:center">
            <span id="config-status" class="cluster-status-text"></span>
            <button class="btn btn-sm" onclick="loadConfig()">Reload</button>
            <button class="btn btn-sm btn-primary" onclick="submitAll()">Run All</button>
        </div>
    </div>
    <div id="config-error"></div>
    <div id="task-tiles" class="task-tiles"></div>
    <div id="task-empty" class="empty-state" style="display:none">
        No .wes config files found in project root
    </div>
</div>

<div id="result" class="hidden"></div>
{% endblock %}

{% block scripts %}
<script>
const TIME_PRESETS = [
    {label: '30m', hours: 0.5},
    {label: '1h', hours: 1},
    {label: '2h', hours: 2},
    {label: '4h', hours: 4},
    {label: '8h', hours: 8},
    {label: '24h', hours: 24},
    {label: '2d', hours: 48},
    {label: '7d', hours: 168},
];

let taskConfigs = [];

async function loadConfig() {
    const status = document.getElementById('config-status');
    const error = document.getElementById('config-error');
    const tiles = document.getElementById('task-tiles');
    const empty = document.getElementById('task-empty');
    status.textContent = 'Loading...';
    error.innerHTML = '';

    try {
        const resp = await fetch('/api/config');
        const data = await resp.json();
        taskConfigs = data;
        if (!data.length) {
            tiles.innerHTML = '';
            empty.style.display = '';
            status.textContent = '';
            return;
        }
        empty.style.display = 'none';
        renderTiles();
        status.textContent = data.length + ' task' + (data.length > 1 ? 's' : '');
    } catch (err) {
        error.innerHTML = '<div class="error">' + err.message + '</div>';
        status.textContent = '';
    }
}

function renderTiles() {
    const tiles = document.getElementById('task-tiles');
    let html = '';
    taskConfigs.forEach((t, i) => {
        const repo = t.git_url.split('/').pop().replace('.git', '');
        const memGB = parseMemGB(t.memory) || 4;
        const timeH = parseTimeHours(t.time) || 4;
        const cpus = parseInt(t.cpus) || 1;
        const gpus = parseInt(t.gpus) || 0;
        const timePreset = TIME_PRESETS.find(p => p.hours === timeH);

        html += '<div class="st-tile" id="tile-' + i + '">';
        html += '<div class="st-header">';
        html += '<div class="st-title">' + t.name + '</div>';
        html += '<button class="btn btn-sm btn-primary" onclick="submitTask(' + i + ')" id="run-btn-' + i + '">Run</button>';
        html += '</div>';

        html += '<div class="st-info">';
        html += '<span class="st-info-item mono">' + repo + '</span>';
        if (t.branch) html += '<span class="st-info-item">' + t.branch + '</span>';
        html += '<span class="st-info-item mono">' + t.ssh + '</span>';
        html += '</div>';

        html += '<div class="st-controls">';

        html += '<div class="st-row">';
        html += '<div class="st-field">';
        html += '<label>Node</label>';
        html += '<input type="text" class="st-input" data-i="' + i + '" data-key="nodelist" value="' + (t.nodelist || '') + '" placeholder="any">';
        html += '</div>';
        html += sliderField(i, 'Memory', 'memory', memGB, 1, 128, 'G', 'slider-mem');
        html += '</div>';

        html += '<div class="st-row">';
        html += sliderField(i, 'CPUs', 'cpus', cpus, 1, 64, '', 'slider-cpu');
        html += sliderField(i, 'GPUs', 'gpus', gpus, 0, 8, '', 'slider-gpu');
        html += timeField(i, timeH);
        html += '</div>';

        html += '</div>';
        html += '</div>';
    });
    tiles.innerHTML = html;

    tiles.querySelectorAll('.st-input, .st-slider').forEach(el => {
        el.addEventListener('input', onControlChange);
    });
}

function sliderField(i, label, key, val, min, max, suffix, cls) {
    let h = '<div class="st-field st-field-slider">';
    h += '<label>' + label + ' <span class="st-val" id="val-' + i + '-' + key + '">' + val + suffix + '</span></label>';
    h += '<input type="range" class="st-slider ' + cls + '" data-i="' + i + '" data-key="' + key + '" data-suffix="' + suffix + '" min="' + min + '" max="' + max + '" value="' + val + '">';
    h += '</div>';
    return h;
}

function timeField(i, hours) {
    let h = '<div class="st-field st-field-time">';
    h += '<label>Time</label>';
    h += '<div class="st-time-chips">';
    TIME_PRESETS.forEach(p => {
        const active = p.hours === hours ? ' active' : '';
        h += '<button type="button" class="time-preset' + active + '" data-i="' + i + '" data-hours="' + p.hours + '" onclick="setTime(' + i + ',' + p.hours + ')">' + p.label + '</button>';
    });
    h += '</div>';
    h += '<input type="hidden" data-i="' + i + '" data-key="time" value="' + formatTime(hours) + '">';
    h += '</div>';
    return h;
}

function parseMemGB(s) {
    if (!s) return 0;
    s = s.trim().toUpperCase();
    if (s.endsWith('G')) return parseFloat(s);
    if (s.endsWith('M')) return Math.round(parseInt(s) / 1024) || 1;
    return parseInt(s) || 0;
}

function parseTimeHours(s) {
    if (!s) return 0;
    const parts = s.trim().split(':');
    if (parts.length === 3) return parseInt(parts[0]) + parseInt(parts[1]) / 60;
    return parseFloat(s) || 0;
}

function formatTime(hours) {
    const h = Math.floor(hours);
    const m = Math.round((hours - h) * 60);
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':00';
}

function onControlChange(e) {
    const i = parseInt(e.target.dataset.i);
    const key = e.target.dataset.key;
    const suffix = e.target.dataset.suffix || '';

    if (e.target.classList.contains('st-slider')) {
        const valEl = document.getElementById('val-' + i + '-' + key);
        if (valEl) valEl.textContent = e.target.value + suffix;
        if (key === 'memory') {
            taskConfigs[i].memory = e.target.value + 'G';
        } else if (key === 'cpus') {
            taskConfigs[i].cpus = e.target.value;
        } else if (key === 'gpus') {
            taskConfigs[i].gpus = e.target.value;
        }
    } else {
        taskConfigs[i][key] = e.target.value;
    }
}

function setTime(i, hours) {
    const tile = document.getElementById('tile-' + i);
    tile.querySelectorAll('.time-preset').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    const hidden = tile.querySelector('input[data-key="time"]');
    hidden.value = formatTime(hours);
    taskConfigs[i].time = hidden.value;
}

function collectOverrides(i) {
    const t = taskConfigs[i];
    const overrides = {};
    if (t.nodelist) overrides.nodelist = t.nodelist;
    if (t.memory) overrides.memory = t.memory;
    if (t.time) overrides.time = t.time;
    if (t.cpus) overrides.cpus = String(t.cpus);
    if (t.gpus) overrides.gpus = String(t.gpus);
    if (t.partition) overrides.partition = t.partition;
    return overrides;
}

async function submitTask(i) {
    const btn = document.getElementById('run-btn-' + i);
    btn.disabled = true;
    btn.textContent = '...';
    const result = document.getElementById('result');
    result.className = '';
    result.textContent = 'Submitting ' + taskConfigs[i].name + '...';

    try {
        const resp = await fetch('/api/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: taskConfigs[i].name,
                overrides: collectOverrides(i),
            }),
        });
        const data = await resp.json();
        if (resp.ok) {
            result.textContent = data.message || (data.task + ': ' + data.state);
        } else {
            result.textContent = 'Error: ' + (data.detail || 'Unknown error');
        }
    } catch (err) {
        result.textContent = 'Error: ' + err.message;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Run';
    }
}

async function submitAll() {
    const result = document.getElementById('result');
    result.className = '';
    const lines = ['Submitting all tasks...'];
    result.textContent = lines.join('\n');

    for (let i = 0; i < taskConfigs.length; i++) {
        const btn = document.getElementById('run-btn-' + i);
        btn.disabled = true;
        btn.textContent = '...';
        try {
            const resp = await fetch('/api/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: taskConfigs[i].name,
                    overrides: collectOverrides(i),
                }),
            });
            const data = await resp.json();
            if (resp.ok) {
                lines.push(taskConfigs[i].name + ': ' + (data.message || data.state));
            } else {
                lines.push(taskConfigs[i].name + ': ERROR - ' + (data.detail || 'Unknown'));
            }
        } catch (err) {
            lines.push(taskConfigs[i].name + ': ERROR - ' + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Run';
        }
        result.textContent = lines.join('\n');
    }
}

loadConfig();
</script>
{% endblock %}
