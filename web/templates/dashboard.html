{% extends "base.html" %}
{% block title %}wes - Dashboard{% endblock %}

{% block content %}
<h1>Dashboard</h1>

<cluster-panel></cluster-panel>

<!-- Tasks Panel -->
<div class="panel">
    <div class="panel-header">
        <h2>Tasks</h2>
        <div style="display:flex;gap:0.5rem;align-items:center">
            <span id="tasks-status" class="cluster-status-text"></span>
            <button class="btn btn-sm" id="reload-btn">Reload</button>
        </div>
    </div>
    <div id="tasks-error"></div>
    <div id="task-tiles" class="task-tiles"></div>
    <div id="task-empty" class="empty-state" style="display:none">
        No .wes config files found in project root
    </div>
</div>

<config-panel id="config-panel"></config-panel>
<div id="result" class="hidden"></div>
{% endblock %}

{% block scripts %}
<script type="module">
let taskConfigs = [];
let cachedTasks = {};
let editingIndex = -1;

async function loadConfig() {
    const status = document.getElementById('tasks-status');
    const error = document.getElementById('tasks-error');
    const empty = document.getElementById('task-empty');
    status.textContent = 'Loading...';
    error.innerHTML = '';

    try {
        const [configResp, tasksResp] = await Promise.all([
            fetch('/api/config'),
            fetch('/api/tasks'),
        ]);
        const data = await configResp.json();
        const tasks = await tasksResp.json();
        cachedTasks = {};
        tasks.forEach(t => { cachedTasks[t.name] = t; });
        taskConfigs = data;
        if (!data.length) {
            empty.style.display = '';
            document.getElementById('task-tiles').innerHTML = '';
            status.textContent = '';
            return;
        }
        empty.style.display = 'none';
        renderTiles();
        status.textContent = data.length + ' task' + (data.length > 1 ? 's' : '');
    } catch (err) {
        error.innerHTML = '<div class="error">' + err.message + '</div>';
        status.textContent = '';
    }
}

function renderTiles() {
    const container = document.getElementById('task-tiles');
    container.innerHTML = '';

    taskConfigs.forEach((t, i) => {
        const tile = document.createElement('task-tile');
        const cached = cachedTasks[t.name];
        tile.data = {
            name: t.name,
            repo: t.git_url ? t.git_url.split('/').pop().replace('.git', '') : '',
            branch: t.branch || '',
            status: cached ? cached.status : 'PENDING',
            artifactCount: cached && cached.artifacts ? cached.artifacts.length : 0,
            memory: t.memory || '',
            cpus: t.cpus || '1',
            gpus: t.gpus || '0',
            time: t.time || '',
            index: i,
        };
        tile.addEventListener('task-edit', e => openConfig(e.detail.index));
        tile.addEventListener('task-delete', e => deleteTask(e.detail.name));
        container.appendChild(tile);
    });

    const addTile = document.createElement('div');
    addTile.className = 'task-tile task-tile-add';
    addTile.onclick = () => openConfig(-1);
    addTile.innerHTML = '<div class="task-tile-add-icon">+</div><div class="task-tile-add-label">New Task</div>';
    container.appendChild(addTile);
}

function openConfig(index) {
    editingIndex = index;
    const panel = document.getElementById('config-panel');
    const clusterPanel = document.querySelector('cluster-panel');

    if (index >= 0 && index < taskConfigs.length) {
        const t = taskConfigs[index];
        panel.open({ editing: true, ...t });
    } else {
        panel.open({ editing: false });
    }

    if (clusterPanel && clusterPanel.allNodes && clusterPanel.allNodes.length) {
        panel.loadNodeOptions(clusterPanel.allNodes);
    }
}

function closeConfig() {
    document.getElementById('config-panel').close();
    editingIndex = -1;
}

async function deleteTask(name) {
    if (!confirm('Remove "' + name + '"? This will cancel running jobs, clean up remote files, and delete the config.')) return;
    const result = document.getElementById('result');
    result.className = '';
    result.textContent = 'Removing ' + name + '...';
    try {
        const resp = await fetch('/api/tasks/' + encodeURIComponent(name), { method: 'DELETE' });
        const data = await resp.json();
        if (resp.ok) {
            result.textContent = data.message || 'Removed ' + name;
            loadConfig();
        } else {
            result.textContent = 'Error: ' + (data.detail || 'Unknown error');
            result.className = 'error';
        }
    } catch (err) {
        result.textContent = 'Error: ' + err.message;
        result.className = 'error';
    }
}

const configPanel = document.getElementById('config-panel');
configPanel.addEventListener('config-success', e => {
    const result = document.getElementById('result');
    result.className = '';
    result.textContent = e.detail.message;
    loadConfig();
});
configPanel.addEventListener('config-error', e => {
    const result = document.getElementById('result');
    result.textContent = e.detail.message;
    result.className = 'error';
});

document.getElementById('reload-btn').addEventListener('click', loadConfig);

loadConfig();
</script>
{% endblock %}
